syntax = "proto3";

option java_multiple_files = true;
option java_package = "analytics";

// Only needed if you also want a direct gRPC call to the stats service
service ApplicationStatsService{
  rpc RecordApplication(ApplicationRecordedEvent) returns (RecordApplicationResponse);
}

// Kafka payload: published by application-service, consumes by the stats services
message ApplicationRecordedEvent{
  string user_id = 1; // UUID as string
  string apply_date = 2;
}

message RecordApplicationResponse{
  bool success = 1;
}
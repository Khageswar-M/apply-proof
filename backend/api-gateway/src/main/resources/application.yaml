server:
  port: 4004

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "*"
                allowedMethods: "*"
                allowedHeaders: "*"
                allowCredentials: true
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:4003}
              predicates:
                - Path=/api/v1/auth/**

            - id: application-service
              uri: ${APPLICATION_SERVICE_URL:http://localhost:4000}
              predicates:
                - Path=/api/v1/applications/**

            - id: analytic-service
              uri: ${ANALYTIC_SERVICE_URL:http://localhost:4001}
              predicates:
                - Path=/api/v1/analytics/**

            - id: mail-service
              uri: ${MAIL_SERVICE_URL:http://localhost:4002}
              predicates:
                - Path=/api/v1/mail/**
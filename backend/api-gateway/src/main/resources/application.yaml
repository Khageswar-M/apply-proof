
server:
  port: 4004

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:

          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true

          # Remove duplicate CORS response headers
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:4003}
              predicates:
                - Path=/api/v1/auth/**

            - id: application-service
              uri: http://localhost:4000
              predicates:
                - Path=/api/v1/applications/**

            - id: analytic-service
#              uri: ${ANALYTIC_SERVICE_URL:http://localhost:4001}
              uri: http://localhost:4001
              predicates:
                - Path=/api/v1/analytics/**

            - id: mail-service
              uri: ${MAIL_SERVICE_URL:http://localhost:4002}
              predicates:
                - Path=/api/v1/mail/**

spring:
  application:
    name: application-service

  datasource:
    #  FOR MYSQL CONFIGURATION
    url: jdbc:mysql://localhost:${DATABASE_PORT}/${DATABASE_NAME}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always



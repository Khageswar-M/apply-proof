spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: admin
    password: ""

  # FIX: h2 should be indented at the same level as datasource, under spring:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false # Recommended for security

  jpa:
    # Note: In newer Spring Boot/Hibernate versions, database-platform is auto-detected and optional
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 2s
      connect-timeout: 2s

server:
  port: 4003

app:
  otp:
    length: ${OTP_LENGTH}
    expiration: ${OTP_EXPIRATION}
  email:
    subject: ${EMAIL_SUBJECT}
    body: ${EMAIL_BODY}

logging:
  level:
    root: info
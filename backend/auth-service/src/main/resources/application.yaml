spring:
  application:
    name: auth-service

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

  # FIX: h2 should be indented at the same level as datasource, under spring:
#  h2:
#    console:
#      enabled: true
#      path: /h2-console
#      settings:
#        web-allow-others: false # Recommended for security

  jpa:
    # Note: In newer Spring Boot/Hibernate versions, database-platform is auto-detected and optional
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 2s
      connect-timeout: 2s

server:
  port: 4003

app:
  otp:
    length: ${OTP_LENGTH}
    expiration: ${OTP_EXPIRATION}
  email:
    subject: ${EMAIL_SUBJECT}
    body: ${EMAIL_BODY}
  cookie:
    secure: true
    same-site: Strict

jwt:
  secret:
    key: ${SECRET_KEY}
  access:
    expiration-ms: 600000    # 10 min
  refresh:
    expiration-ms: 604800000 # 7 days


logging:
  level:
    root: info
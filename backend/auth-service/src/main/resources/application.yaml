spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: admin
    password: ""

  # FIX: h2 should be indented at the same level as datasource, under spring:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false # Recommended for security

  jpa:
    # Note: In newer Spring Boot/Hibernate versions, database-platform is auto-detected and optional
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

server:
  port: 4003

logging:
  level:
    root: info
name: apply-proof

services:

  # ---------------- MYSQL DATABASE ----------------
  mysql-service-db:
    image: mysql:8.4
    container_name: mysql-service-db
    ports:
      - "3000:3306"
    environment:
      MYSQL_DATABASE: db
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - C:\Users\khage\db_volumes\mysql-service-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - internal
    restart: unless-stopped

  # ---------------- KAFKA ----------------
  kafka-applyproof:
    image: apache/kafka:latest
    container_name: kafka-applyproof
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-applyproof:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - internal
    restart: unless-stopped

  # ---------------- REDIS ----------------
  redis-server:
    image: redis:7.4-alpine
    container_name: redis-server
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    networks:
      - internal
    restart: unless-stopped

  # ---------------- MAIL SERVICE ----------------
  mail-service:
    image: mail-service:latest
    container_name: mail-service
    environment:
      MAIL_FROM: onboarding@resend.dev
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_HOST: smtp.resend.com
      RESEND_PORT: 587
      RESEND_USERNAME: resend
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-applyproof:29092
    depends_on:
      - kafka-applyproof
    networks:
      - internal
    restart: unless-stopped

  # ---------------- AUTH SERVICE ----------------
  auth-service:
    image: auth-service:latest
    container_name: auth-service
    environment:
      MYSQL_HOST: mysql-service-db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: db
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

      REDIS_HOST: redis-server
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-applyproof:29092

      SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ACCESS_TOKEN_EXP_MS: 900000
      JWT_REFRESH_TOKEN_EXP_MS: 604800000
      OTP_LENGTH: 6
      OTP_EXPIRATION: 300
      EMAIL_SUBJECT: ApplyProof Email Verification
      EMAIL_BODY: is the one time password to verify your email.

    depends_on:
      mysql-service-db:
        condition: service_healthy
      redis-server:
        condition: service_started
      kafka-applyproof:
        condition: service_started
    networks:
      - internal
    restart: unless-stopped

  # ---------------- ANALYTIC SERVICE ----------------
  analytic-service:
    image: analytic-service:latest
    container_name: analytic-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-service-db:3306/db
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      SPRING_GRPC_SERVER_REFLECTION_ENABLED: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-applyproof:29092
    depends_on:
      mysql-service-db:
        condition: service_healthy
      kafka-applyproof:
        condition: service_started
    networks:
      - internal
    restart: unless-stopped

  # ---------------- APPLICATION SERVICE ----------------
  application-service:
    image: application-service:latest
    container_name: application-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-service-db:3306/db
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always

      ANALYTIC_SERVICE_ADDRESS: analytic-service
      ANALYTIC_SERVICE_GRPC_PORT: 9001

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-applyproof:29092

    depends_on:
      mysql-service-db:
        condition: service_healthy
      kafka-applyproof:
        condition: service_started
      analytic-service:
        condition: service_started
    networks:
      - internal
    restart: unless-stopped

  # ---------------- API GATEWAY ----------------
  api-gateway:
    image: api-gateway:latest
    container_name: api-gateway
    ports:
      - "4004:4004"
    environment:
      AUTH_SERVICE_URL: http://auth-service:4003
      APPLICATION_SERVICE_URL: http://application-service:4000
      ANALYTIC_SERVICE_URL: http://analytic-service:4001
      MAIL_SERVICE_URL: http://mail-service:4002
    depends_on:
      - auth-service
      - application-service
      - analytic-service
      - mail-service
    networks:
      - internal
    restart: unless-stopped

# ---------------- VOLUMES ----------------
volumes:
  mysql-data:

# ---------------- NETWORK ----------------
networks:
  internal:
    name: internal
    external: true
spring:
  application:
    name: mail-service

  kafka:
    consumer:
      group-id: analytic-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer

  mail:
    host: ${RESEND_HOST}
    port: ${RESEND_PORT}
    username: ${RESEND_USERNAME}
    password: ${RESEND_API_KEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

app:
  mail:
    from: ${MAIL_SERVICE:onboarding@resend.dev}

server:
  port: 4002

logging:
  level:
    root: info
